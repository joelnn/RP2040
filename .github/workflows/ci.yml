name: PicoBOB G540 Build CI

on:
  push:
    branches: [ picobob-g540-build, master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          gcc-arm-none-eabi \
          libnewlib-arm-none-eabi \
          libstdc++-arm-none-eabi-newlib \
          build-essential \
          python3 \
          python3-pip
          
    - name: Setup Pico SDK
      run: |
        git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init
        cd ..
        
    - name: Configure PicoBOB G540
      run: |
        cat > my_machine.h << 'EOF'
        /*
          my_machine.h - configuration for PicoBOB G540 build
          
          Auto-generated by GitHub CI
        */
        
        // Enable PicoBOB G540 board
        #define BOARD_PICOBOB_G540
        
        // Configuration
        #define USB_SERIAL_CDC          1 // Serial communication via native USB
        
        // Control signals
        #define CONTROL_ENABLE          (CONTROL_HALT|CONTROL_FEED_HOLD) // Enable halt and feed hold
        
        // Spindle configuration
        #define DRIVER_SPINDLE_ENABLE   (SPINDLE_PWM|SPINDLE_ENA) // PWM spindle with enable
        
        // Default axis configuration is 3 axes (X, Y, Z)
        /**/
        EOF
        
    - name: Build firmware
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        mkdir -p build
        cd build
        cmake -DPICO_BOARD=pico ..
        make -j$(nproc)
        
    - name: Check build outputs
      run: |
        ls -la build/grblHAL.*
        if [ ! -f build/grblHAL.uf2 ]; then
          echo "Error: grblHAL.uf2 not found!"
          exit 1
        fi
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: picobob-g540-firmware
        path: |
          build/grblHAL.uf2
          build/grblHAL.bin
          build/grblHAL.hex
        retention-days: 30
        
    - name: Create release (on tag push)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/grblHAL.uf2
          build/grblHAL.bin
          build/grblHAL.hex
        body: |
          ## PicoBOB G540 Firmware Release
          
          This release contains the grblHAL firmware for the PicoBOB G540 board.
          
          ### Installation
          1. Hold the BOOTSEL button on your Raspberry Pi Pico
          2. Connect the Pico to your computer via USB
          3. Release the BOOTSEL button
          4. Copy `grblHAL.uf2` to the RPI-RP2 drive that appears
          
          ### Configuration
          - Board: PicoBOB G540
          - USB Serial: Enabled
          - Control signals: Halt and Feed Hold
          - Spindle: PWM with Enable signal
          - Axes: X, Y, Z (3-axis configuration)